name: LabNotes v1.8.1 assessment scope

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/labnotes-v181-assessment-scope.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update LabNotes to v1.8.1
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          if '<title>LabNotes v1.8.1</title>' in text:
              print('Already upgraded')
              raise SystemExit(0)
          text=text.replace('<title>LabNotes v1.8</title>','<title>LabNotes v1.8.1</title>')
          text=text.replace('<div class="version">v1.8</div>','<div class="version">v1.8.1</div>')
          text=text.replace("for(const key of ['labnotes_v1_8','labnotes_v1_7_2'","for(const key of ['labnotes_v1_8_1','labnotes_v1_8','labnotes_v1_7_2'")
          text=text.replace("function persist(){localStorage.setItem('labnotes_v1_8',JSON.stringify(data))}","function persist(){localStorage.setItem('labnotes_v1_8_1',JSON.stringify(data))}")
          text=text.replace("data.labs.unshift({id:Date.now(),cls:c,name:n,date:d,students:","data.labs.unshift({id:Date.now(),cls:c,name:n,date:d,assessmentScope:'lab',students:")
          css="\n.assessment-scope-control{display:flex;align-items:end;gap:10px;flex-wrap:wrap;margin:0 0 12px;padding:10px 12px;border:1px solid var(--border);border-radius:12px;background:var(--surface-soft)}\n.assessment-scope-control label{margin:0;min-width:150px}\n.assessment-scope-control select{width:auto;min-width:230px;padding:7px 30px 7px 9px;font-size:.8rem}\n.student-detail-grid.single{grid-template-columns:1fr}\n@media(max-width:760px){.assessment-scope-control{align-items:stretch}.assessment-scope-control select{width:100%;min-width:0}}\n"
          text=text.replace('</style>',css+'</style>',1)
          marker='function renderElevMode(l){'
          setter="function setAssessmentScope(labId,value){let l=data.labs.find(x=>x.id===labId);if(!l)return;l.assessmentScope=value||\'lab\';persist();renderLab();}\n"
          text=text.replace(marker,setter+marker,1)
          text=text.replace("function renderElevMode(l){\n  let q=", "function renderElevMode(l){\n  let scope=l.assessmentScope||'lab',showObs=scope==='lab'||scope==='both',showReport=scope==='report'||scope==='both';\n  let q=",1)
          text=text.replace('<div class="student-detail-grid">','<div class="student-detail-grid ${scope===\'both\'?\'\':\'single\'}">',1)
          text=text.replace('<section class="student-detail-section">\n          <div class="report-heading"><strong>Timeobservasjoner</strong>','<section class="student-detail-section" ${showObs?\'\':\'style="display:none"\'}>\n          <div class="report-heading"><strong>Timeobservasjoner</strong>',1)
          first=text.find('<section class="student-detail-section" ${showObs')
          second=text.find('<section class="student-detail-section">',first+1)
          if second!=-1:
              text=text[:second]+text[second:].replace('<section class="student-detail-section">','<section class="student-detail-section" ${showReport?\'\':\'style="display:none"\'}>',1)
          old="activeLab.innerHTML=`<div class=\"toolbar\"><div class=\"toolbar-left\"><div><strong>${esc(l.name)}</strong><div class=\"muted\">${esc(l.cls)} · ${esc(l.date)}</div></div></div><div class=\"toolbar-right\"><span class=\"hint\">${l.students.length} elever</span></div></div>`+renderElevMode(l);"
          new="if(!l.assessmentScope)l.assessmentScope='lab';let scopeControl=`<div class=\"assessment-scope-control\"><div><label>Hva skal vurderes?</label><div class=\"hint\">Valget gjelder hele dette timenotatet.</div></div><select onchange=\"setAssessmentScope(${l.id},this.value)\"><option value=\"lab\" ${l.assessmentScope==='lab'?'selected':''}>Lab / timeobservasjoner</option><option value=\"report\" ${l.assessmentScope==='report'?'selected':''}>Labrapport</option><option value=\"both\" ${l.assessmentScope==='both'?'selected':''}>Begge deler</option></select></div>`;activeLab.innerHTML=`<div class=\"toolbar\"><div class=\"toolbar-left\"><div><strong>${esc(l.name)}</strong><div class=\"muted\">${esc(l.cls)} · ${esc(l.date)}</div></div></div><div class=\"toolbar-right\"><span class=\"hint\">${l.students.length} elever</span></div></div>${scopeControl}`+renderElevMode(l);"
          if old not in text:
              raise RuntimeError('renderLab assignment not found')
          text=text.replace(old,new,1)
          p.write_text(text,encoding='utf-8')
          PY
          if git diff --quiet -- index.html; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'LabNotes v1.8.1: choose assessment type per timenote'
          git push
